name: Test unsupported providerStrategy is rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          targetPlatform: StandaloneLinux64
          projectPath: test-project
          providerStrategy: aws
      - name: Assert action failed before running the CLI
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.engineExitCode }}
        run: |
          echo "outcome: $OUTCOME"
          echo "engineExitCode: '$EXIT_CODE'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for providerStrategy=aws"
            exit 1
          fi
          if [ -n "$EXIT_CODE" ]; then
            echo "FAIL: engineExitCode should not be set; the CLI must not run for an unsupported strategy"
            exit 1
          fi
          echo "PASS"
