name: Test invalid versioning strategy fails with validation error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          targetPlatform: StandaloneLinux64
          versioning: InvalidStrategy
          skipActivation: 'true'
          unityVersion: '2022.3.0f1'
      - name: Assert action fails with validation error for invalid versioning strategy
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because "InvalidStrategy" is not a valid versioning
          # strategy. Valid strategies are: None, Semantic, Tag, Custom.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected for invalid versioning strategy"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with invalid versioning strategy"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
