name: Test invalid versioning strategy error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid versioning strategy (expect failure)
        id: action
        uses: .
        with:
          targetPlatform: StandaloneLinux64
          versioning: InvalidStrategy
          unityVersion: 2022.3.0f1
          unityLicensingServer: http://localhost:1234
        continue-on-error: true

      - name: Assert action failed with versioning error
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid versioning strategy, but outcome was ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid versioning strategy"
