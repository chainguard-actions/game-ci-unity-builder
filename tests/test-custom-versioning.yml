name: Test custom versioning strategy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          targetPlatform: StandaloneLinux64
          versioning: Custom
          version: '1.2.3'
          skipActivation: 'true'
          unityVersion: '2022.3.0f1'
      - name: Assert action ran and buildVersion output is set when action succeeds
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUILD_VERSION: ${{ steps.action.outputs.buildVersion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "buildVersion: $BUILD_VERSION"
          # The action will fail because no Unity Docker image is available in the test
          # environment. If it somehow succeeds, verify the buildVersion output is set.
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$BUILD_VERSION" ]; then
              echo "FAIL: action succeeded but buildVersion output is empty"
              exit 1
            fi
            echo "PASS: buildVersion='$BUILD_VERSION'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no Unity Docker image available in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
