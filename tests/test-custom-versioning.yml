name: Test custom versioning strategy
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          targetPlatform: StandaloneLinux64
          versioning: Custom
          version: '1.2.3'
      - name: Assert action ran and failed gracefully (no Unity license in harness)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUILD_VERSION: ${{ steps.action.outputs.buildVersion }}
          ENGINE_EXIT_CODE: ${{ steps.action.outputs.engineExitCode }}
        run: |
          echo "outcome: $OUTCOME"
          echo "buildVersion: $BUILD_VERSION"
          echo "engineExitCode: $ENGINE_EXIT_CODE"
          # The action is expected to fail because no Unity license is available in the harness.
          # If it somehow succeeds, the buildVersion should be 1.2.3 (the custom version we set).
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no Unity license in harness)"
          elif [ "$OUTCOME" = "success" ]; then
            if [ "$BUILD_VERSION" = "1.2.3" ]; then
              echo "PASS: action succeeded with correct custom version 1.2.3"
            else
              echo "FAIL: action succeeded but buildVersion '$BUILD_VERSION' != '1.2.3'"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
