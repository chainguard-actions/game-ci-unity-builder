name: Test invalid providerStrategy fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          targetPlatform: StandaloneLinux64
          providerStrategy: aws
        continue-on-error: true

      - name: Assert action fails for non-local providerStrategy
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for providerStrategy=aws, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for unsupported providerStrategy"
