name: Test Android platform build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          targetPlatform: Android
          versioning: Custom
          version: '2.0.0'
          androidExportType: androidPackage
          androidSymbolType: none
      - name: Assert action ran and failed gracefully (no Unity license in harness)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUILD_VERSION: ${{ steps.action.outputs.buildVersion }}
          ANDROID_VERSION_CODE: ${{ steps.action.outputs.androidVersionCode }}
          ENGINE_EXIT_CODE: ${{ steps.action.outputs.engineExitCode }}
        run: |
          echo "outcome: $OUTCOME"
          echo "buildVersion: $BUILD_VERSION"
          echo "androidVersionCode: $ANDROID_VERSION_CODE"
          echo "engineExitCode: $ENGINE_EXIT_CODE"
          # The action is expected to fail because no Unity license is available in the harness.
          # If it somehow succeeds, the buildVersion should be 2.0.0 and androidVersionCode should be set.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (no Unity license in harness)"
          elif [ "$OUTCOME" = "success" ]; then
            if [ "$BUILD_VERSION" = "2.0.0" ]; then
              echo "PASS: action succeeded with correct custom version 2.0.0"
            else
              echo "FAIL: action succeeded but buildVersion '$BUILD_VERSION' != '2.0.0'"
              exit 1
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
