name: Test Android platform inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          targetPlatform: Android
          versioning: None
          androidExportType: androidPackage
          androidSymbolType: none
          skipActivation: 'true'
          unityVersion: '2022.3.0f1'
      - name: Assert action ran with Android platform inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ENGINE_EXIT_CODE: ${{ steps.action.outputs.engineExitCode }}
        run: |
          echo "outcome: $OUTCOME"
          echo "engineExitCode: $ENGINE_EXIT_CODE"
          # The action processes Android-specific inputs (androidExportType, androidSymbolType)
          # and will fail at the Docker/build stage since no Unity image is available.
          # A failure here means the action at least parsed inputs without throwing a
          # validation error for the Android configuration.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at build stage (expected - no Unity Docker image available)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
