name: Test basic usage - targetPlatform required
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          targetPlatform: StandaloneLinux64
          cliVersion: 'latest'
        continue-on-error: true

      - name: Assert engineExitCode output is set
        env:
          ENGINE_EXIT_CODE: ${{ steps.action.outputs.engineExitCode }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "engineExitCode: $ENGINE_EXIT_CODE"
          # The action should either succeed (unlikely without Unity) or fail
          # gracefully with an exit code set. The key assertion is that the
          # action ran far enough to set the engineExitCode output OR failed
          # with a known error (no Unity project / CLI build failure).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            # The action is expected to fail in the harness (no Unity project),
            # but it should have at least attempted to run the CLI.
            echo "PASS: action failed gracefully (no Unity project in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
