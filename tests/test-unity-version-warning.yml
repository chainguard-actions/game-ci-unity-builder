name: Test unityVersion non-auto emits warning but continues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          targetPlatform: StandaloneLinux64
          unityVersion: '2022.3.0f1'
          cliVersion: 'latest'
        continue-on-error: true

      - name: Assert action ran (warning does not abort the action)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ENGINE_EXIT_CODE: ${{ steps.action.outputs.engineExitCode }}
        run: |
          echo "outcome: $OUTCOME"
          echo "engineExitCode: $ENGINE_EXIT_CODE"
          # The action should NOT fail due to the unityVersion warning alone.
          # It may fail because there is no Unity project in the harness,
          # but it should not fail before even attempting to download the CLI.
          # Both success and failure are acceptable here; what matters is that
          # the action ran past the warning step.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at CLI/build stage (not at warning stage)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
