name: Test pinned cliVersion downloads specific release
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          targetPlatform: StandaloneLinux64
          cliVersion: 'v0.1.0'
        continue-on-error: true

      - name: Assert action ran with pinned CLI version
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ENGINE_EXIT_CODE: ${{ steps.action.outputs.engineExitCode }}
        run: |
          echo "outcome: $OUTCOME"
          echo "engineExitCode: $ENGINE_EXIT_CODE"
          # The action downloads a pinned CLI version and runs it.
          # In the harness there is no Unity project, so the build will fail,
          # but the action should have run far enough to set engineExitCode
          # (or fail at the CLI execution stage, not at the download stage).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at CLI/build stage (expected without Unity project)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
