name: Test missing Unity license error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without Unity license (expect failure)
        id: action
        uses: .
        with:
          targetPlatform: StandaloneLinux64
          versioning: None
          unityVersion: 2022.3.0f1
        continue-on-error: true

      - name: Assert action failed with license error
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail due to missing Unity license, but outcome was ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when no Unity license was provided"
