name: Test invalid androidSymbolType validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          targetPlatform: Android
          versioning: None
          androidSymbolType: invalid-type
          skipActivation: 'true'
          unityVersion: '2022.3.0f1'

      - name: Assert action failed (invalid androidSymbolType should cause failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed with invalid androidSymbolType"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with invalid androidSymbolType"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
