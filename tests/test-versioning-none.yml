name: Test versioning strategy None
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          targetPlatform: StandaloneLinux64
          versioning: None
          skipActivation: 'true'
          # versioning=None should set buildVersion to 'none'
          # Action will fail at Docker stage but outputs may still be set
      - name: Assert versioning None outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUILD_VERSION: ${{ steps.action.outputs.buildVersion }}
          ENGINE_EXIT_CODE: ${{ steps.action.outputs.engineExitCode }}
        run: |
          echo "outcome: $OUTCOME"
          echo "buildVersion: $BUILD_VERSION"
          echo "engineExitCode: $ENGINE_EXIT_CODE"
          # The action fails at Docker stage (no Unity image available).
          # When versioning=None, buildVersion should be 'none' if outputs were set.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at Docker stage as expected (no Unity image)"
          elif [ "$OUTCOME" = "success" ]; then
            if [ "$BUILD_VERSION" != "none" ]; then
              echo "FAIL: expected buildVersion='none' but got '$BUILD_VERSION'"
              exit 1
            fi
            echo "PASS: buildVersion is 'none' as expected"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
