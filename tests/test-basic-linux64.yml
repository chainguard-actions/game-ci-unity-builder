name: Test basic StandaloneLinux64 build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          targetPlatform: StandaloneLinux64
          versioning: None
          skipActivation: 'true'
          unityVersion: '2022.3.0f1'

      - name: Assert action ran and failed gracefully (no Unity installed in harness)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUILD_VERSION: ${{ steps.action.outputs.buildVersion }}
          ENGINE_EXIT_CODE: ${{ steps.action.outputs.engineExitCode }}
        run: |
          echo "outcome: $OUTCOME"
          echo "buildVersion: $BUILD_VERSION"
          echo "engineExitCode: $ENGINE_EXIT_CODE"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Unity not available in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
