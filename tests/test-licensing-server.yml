name: Test Unity licensing server bypasses serial check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          targetPlatform: StandaloneLinux64
          versioning: Custom
          version: '2.0.0'
          unityLicensingServer: 'http://localhost:1234'
          skipActivation: 'true'
          # unityLicensingServer bypasses the UNITY_SERIAL/UNITY_LICENSE requirement
          # The action will still fail at the Docker/build stage without a real Unity setup
      - name: Assert action ran past license check
        env:
          OUTCOME: ${{ steps.action.outcome }}
          BUILD_VERSION: ${{ steps.action.outputs.buildVersion }}
          ENGINE_EXIT_CODE: ${{ steps.action.outputs.engineExitCode }}
        run: |
          echo "outcome: $OUTCOME"
          echo "buildVersion: $BUILD_VERSION"
          echo "engineExitCode: $ENGINE_EXIT_CODE"
          # With a licensing server set, the action skips the serial check.
          # It will fail at the Docker stage (no Unity image), so outcome=failure is expected.
          # If somehow it succeeds, buildVersion must be set.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at Docker stage (expected without Unity image)"
          elif [ "$OUTCOME" = "success" ]; then
            if [ -z "$BUILD_VERSION" ]; then
              echo "FAIL: action succeeded but buildVersion output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with buildVersion=$BUILD_VERSION"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
