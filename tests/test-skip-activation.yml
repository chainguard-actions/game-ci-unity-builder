name: Test skip activation mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          targetPlatform: StandaloneLinux64
          versioning: None
          skipActivation: 'true'
          unityVersion: '2022.3.0f1'
      - name: Assert action ran with skip activation (fails at Docker/build stage, not license stage)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ENGINE_EXIT_CODE: ${{ steps.action.outputs.engineExitCode }}
        run: |
          echo "outcome: $OUTCOME"
          echo "engineExitCode: $ENGINE_EXIT_CODE"
          # With skipActivation=true, the action skips license validation and proceeds
          # to the build stage. It will fail because no Unity Docker image is available,
          # but it should not fail with a "Missing Unity License" error.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at build stage (expected - no Unity Docker image available)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
