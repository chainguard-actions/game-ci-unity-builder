name: Test skip activation flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          targetPlatform: StandaloneWindows64
          unityVersion: '2022.3.0f1'
          versioning: None
          buildName: SkipActivationBuild
          skipActivation: 'true'

      - name: Assert action ran with skipActivation or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ENGINE_EXIT_CODE: ${{ steps.action.outputs.engineExitCode }}
        run: |
          echo "outcome: $OUTCOME"
          echo "engineExitCode: $ENGINE_EXIT_CODE"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded"
            if [ -z "$ENGINE_EXIT_CODE" ]; then
              echo "FAIL: action succeeded but engineExitCode output is empty"
              exit 1
            fi
            echo "PASS: engineExitCode=$ENGINE_EXIT_CODE"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Unity not available in harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
