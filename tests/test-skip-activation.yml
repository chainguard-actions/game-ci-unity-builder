name: Test skipActivation bypasses license check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          targetPlatform: StandaloneLinux64
          versioning: Custom
          version: '1.0.0'
          skipActivation: 'true'
          # skipActivation bypasses the license check; action will still fail
          # when trying to pull/run the Unity Docker image (no real Unity available)
      - name: Assert action ran (skipped license check, failed at Docker stage)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ENGINE_EXIT_CODE: ${{ steps.action.outputs.engineExitCode }}
          BUILD_VERSION: ${{ steps.action.outputs.buildVersion }}
        run: |
          echo "outcome: $OUTCOME"
          echo "engineExitCode: $ENGINE_EXIT_CODE"
          echo "buildVersion: $BUILD_VERSION"
          # The action should either:
          # - fail at the Docker stage (no Unity image available) → outcome=failure
          # - succeed if somehow Docker is available → outcome=success with outputs set
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at Docker stage (expected without Unity image)"
          elif [ "$OUTCOME" = "success" ]; then
            if [ -z "$BUILD_VERSION" ]; then
              echo "FAIL: action succeeded but buildVersion output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with buildVersion=$BUILD_VERSION"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
