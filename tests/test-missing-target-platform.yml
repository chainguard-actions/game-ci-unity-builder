name: Test missing targetPlatform fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          targetPlatform: ''
        continue-on-error: true

      - name: Assert action fails when targetPlatform is empty
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when targetPlatform is empty, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when targetPlatform is empty"
