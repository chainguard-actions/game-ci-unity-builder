name: Test invalid cliVersion fails cleanly
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          targetPlatform: StandaloneLinux64
          projectPath: test-project
          cliVersion: v0.0.0-this-tag-does-not-exist
      - name: Assert action failed without running a build
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.engineExitCode }}
        run: |
          echo "outcome: $OUTCOME"
          echo "engineExitCode: '$EXIT_CODE'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for a nonexistent cliVersion"
            exit 1
          fi
          if [ -n "$EXIT_CODE" ]; then
            echo "FAIL: engineExitCode should not be set when the CLI could not be installed"
            exit 1
          fi
          echo "PASS"
